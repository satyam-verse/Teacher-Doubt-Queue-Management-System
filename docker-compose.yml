version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: doubtx-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: doubtDB
      MYSQL_USER: admin
      MYSQL_PASSWORD: devpassword
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: doubtx-backend
    restart: always
    environment:
      FLASK_ENV: development
      DATABASE_URL: mysql+pymysql://admin:devpassword@db:3306/doubtDB
      SECRET_KEY: dev-secret-key-doubtx
      JWT_SECRET_KEY: dev-jwt-secret-key-doubtx
      PORT: 5000
    ports:
      - "5000:5000"
    depends_on:
      - db

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.frontend
    container_name: doubtx-frontend
    restart: always
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  mysql_data:
